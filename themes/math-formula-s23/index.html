<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Formula Theme · S23 Ultra</title>
<style>
  :root { --w: 1440; --h: 3088; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: #0a0c12; color: #e8edf2;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 24px 16px;
  }
  h1 { font-size: 20px; margin: 6px 0 0; font-weight: 600; letter-spacing: .3px; }
  p.sub { margin: 0; color: #8b97a6; font-size: 13px; text-align: center; }
  .panel { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 760px; }
  button {
    background: #161b26; color: #dfe6ee; border: 1px solid #28303f; border-radius: 10px;
    padding: 10px 14px; font-size: 13px; cursor: pointer; transition: .15s;
  }
  button:hover { border-color: #2fe0f0; color: #fff; }
  button.swatch { width: 40px; height: 40px; padding: 0; border-radius: 50%; }
  button.swatch.active { outline: 2px solid #fff; outline-offset: 2px; }
  .actions button { background: #2fe0f0; color: #04222a; border: none; font-weight: 600; }
  .actions button:hover { filter: brightness(1.08); }
  .stage {
    width: min(360px, 86vw); aspect-ratio: var(--w) / var(--h);
    border-radius: 26px; overflow: hidden; box-shadow: 0 18px 60px rgba(0,0,0,.6);
    border: 1px solid #20242e;
  }
  .stage svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <h1>Math Formula Theme — Galaxy S23 Ultra</h1>
  <p class="sub">Native 1440 × 3088 · packed field of ~100 equations · pick a palette, then export</p>

  <div class="panel" id="palette"></div>
  <div class="panel actions">
    <button id="shuffle">⟳ Shuffle layout</button>
    <button id="png">⬇ Download PNG (1440×3088)</button>
    <button id="svg">⬇ Download SVG</button>
  </div>

  <div class="stage" id="stage"></div>
  <p class="sub">Phone: open the PNG → save → <b>Set as wallpaper</b> → Home &amp; Lock (turn off cropping/zoom).</p>

<script src="generate.js"></script>
<script>
let current = "AMOLED Cyan";
let seed = 7;

function render() {
  document.getElementById("stage").innerHTML = MathTheme.buildSVG(current, seed);
}

const pal = document.getElementById("palette");
Object.entries(MathTheme.PALETTES).forEach(([name, p]) => {
  const b = document.createElement("button");
  b.className = "swatch" + (name === current ? " active" : "");
  b.style.background = p.a; b.title = name;
  b.onclick = () => {
    current = name; render();
    [...pal.children].forEach(c => c.classList.remove("active"));
    b.classList.add("active");
  };
  pal.appendChild(b);
});
render();

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
const slug = () => current.replace(/\s+/g, "-").toLowerCase();

document.getElementById("shuffle").onclick = () => { seed = (Math.random() * 1e9) | 0; render(); };

document.getElementById("svg").onclick = () => {
  downloadBlob(new Blob([MathTheme.buildSVG(current, seed)], {type:"image/svg+xml"}), `math-s23-${slug()}.svg`);
};

document.getElementById("png").onclick = () => {
  const img = new Image();
  const blobUrl = URL.createObjectURL(new Blob([MathTheme.buildSVG(current, seed)], {type:"image/svg+xml"}));
  img.onload = () => {
    const c = document.createElement("canvas");
    c.width = MathTheme.W; c.height = MathTheme.H;
    c.getContext("2d").drawImage(img, 0, 0, MathTheme.W, MathTheme.H);
    URL.revokeObjectURL(blobUrl);
    c.toBlob(b => downloadBlob(b, `math-s23-${slug()}.png`), "image/png");
  };
  img.src = blobUrl;
};
</script>
</body>
</html>
