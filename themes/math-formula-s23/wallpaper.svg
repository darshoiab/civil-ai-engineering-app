<?xml version="1.0" encoding="UTF-8"?>
<!--
  Math Formula Theme — Samsung Galaxy S23 Ultra
  Native resolution: 1440 x 3088 (QHD+, 19.3:9). AMOLED-friendly deep background.
  Open in a browser, or use index.html to recolor and export a PNG.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3088" viewBox="0 0 1440 3088">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#070b16"/>
      <stop offset="55%" stop-color="#04060d"/>
      <stop offset="100%" stop-color="#010206"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="34%" r="62%">
      <stop offset="0%"  stop-color="#16c2d4" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#0e7c9c" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1440" height="3088" fill="url(#bg)"/>
  <rect width="1440" height="3088" fill="url(#glow)"/>

  <!-- Faint formula field (low-opacity texture) -->
  <g font-family="'Cambria Math','Latin Modern Math','Times New Roman',serif"
     font-style="italic" fill="#5fd6e6" opacity="0.10">
    <text x="120"  y="980"  font-size="58">∮ E·dl = −dΦ/dt</text>
    <text x="860"  y="1090" font-size="52">ζ(s) = Σ 1/nˢ</text>
    <text x="90"   y="1230" font-size="64">∂u/∂t = α ∇²u</text>
    <text x="110"  y="720"  font-size="50">det(A − λI) = 0</text>
    <text x="120"  y="2160" font-size="56">cos²θ + sin²θ = 1</text>
    <text x="820"  y="820"  font-size="60">f(x) = Σ aₙxⁿ</text>
    <text x="110"  y="1760" font-size="54">∇·B = 0</text>
    <text x="700"  y="900"  font-size="58">lim (1+1/n)ⁿ = e</text>
    <text x="130"  y="2020" font-size="62">Γ(n) = (n−1)!</text>
    <text x="800"  y="2140" font-size="50">x = (−b ± √(b²−4ac)) / 2a</text>
    <text x="120"  y="2290" font-size="56">P(A|B) = P(B|A)P(A)/P(B)</text>
    <text x="840"  y="2400" font-size="54">i ℏ ∂ψ/∂t = Ĥψ</text>
    <text x="100"  y="2560" font-size="60">∫ f dμ</text>
    <text x="720"  y="2660" font-size="52">∇ × B = μ₀J + μ₀ε₀ ∂E/∂t</text>
    <text x="160"  y="2820" font-size="58">a² + b² = c²</text>
    <text x="800"  y="2930" font-size="54">φ = (1+√5)/2</text>
  </g>

  <!-- Hero formulas (crisp, glowing) -->
  <g font-family="'Cambria Math','Latin Modern Math','Times New Roman',serif"
     font-style="italic" text-anchor="middle">

    <!-- Euler's identity -->
    <g filter="url(#soft)" fill="#1fe0f0" opacity="0.5">
      <text x="720" y="1340" font-size="150">e<tspan font-size="92" dy="-46">iπ</tspan><tspan dy="46"> + 1 = 0</tspan></text>
    </g>
    <text x="720" y="1340" font-size="150" fill="#eafcff">e<tspan font-size="92" dy="-46">iπ</tspan><tspan dy="46"> + 1 = 0</tspan></text>

    <!-- Gaussian integral -->
    <text x="720" y="1640" font-size="86" fill="#9fe9f2" opacity="0.92">∫<tspan font-size="44" dy="40">−∞</tspan><tspan font-size="44" dy="-80">∞</tspan><tspan font-size="86" dy="40"> e<tspan font-size="52" dy="-26">−x²</tspan><tspan dy="26"> dx = √π</tspan></tspan></text>

    <!-- Basel problem -->
    <text x="720" y="1880" font-size="78" fill="#7fd9e6" opacity="0.85">Σ 1/n² = π²/6</text>

  </g>

  <!-- subtle hairline frame -->
  <rect x="36" y="36" width="1368" height="3016" rx="44"
        fill="none" stroke="#1fe0f0" stroke-opacity="0.08" stroke-width="2"/>
</svg>
