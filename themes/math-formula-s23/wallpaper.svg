    <radialGradient id="glow" cx="50%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#2fe0f0" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#2fe0f0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="3088" fill="url(#bg)"/>
  <rect width="1440" height="3088" fill="url(#glow)"/>
  <g font-family="'Cambria Math','Latin Modern Math','Times New Roman',serif" font-style="italic">
    <text x="76" y="250" font-size="56" fill="#5fd6e6" opacity="0.13">exp(iπ) + 1 = 0</text>
    <text x="501" y="250" font-size="62" fill="#5fd6e6" opacity="0.13">∫ e⁻ˣ² dx = √π</text>
    <text x="944" y="250" font-size="62" fill="#5fd6e6" opacity="0.12">θ = s/r</text>
    <text x="1187" y="250" font-size="40" fill="#5fd6e6" opacity="0.08">V = IR</text>
    <text x="87" y="343" font-size="56" fill="#5fd6e6" opacity="0.13">∂²u/∂t² = c² ∇²u</text>
    <text x="539" y="343" font-size="50" fill="#5fd6e6" opacity="0.09">n! = ∏ k</text>
    <text x="97" y="430" font-size="56" fill="#5fd6e6" opacity="0.08">sin(a±b) = sin a cos b ± cos a sin b</text>
    <text x="1063" y="430" font-size="44" fill="#2fe0f0" opacity="0.42">iℏ ∂ψ/∂t = Ĥψ</text>
    <text x="102" y="520" font-size="62" fill="#5fd6e6" opacity="0.06">gcd(a,b)·lcm(a,b) = ab</text>
    <text x="773" y="520" font-size="56" fill="#5fd6e6" opacity="0.11">c = λf</text>
    <text x="966" y="520" font-size="62" fill="#5fd6e6" opacity="0.13">z = r eⁱθ</text>
    <text x="100" y="613" font-size="56" fill="#5fd6e6" opacity="0.12">cos²θ + sin²θ = 1</text>
    <text x="577" y="613" font-size="40" fill="#5fd6e6" opacity="0.10">λ = h/p</text>
    <text x="734" y="613" font-size="50" fill="#5fd6e6" opacity="0.09">1+2+⋯+n = n(n+1)/2</text>
    <text x="101" y="693" font-size="44" fill="#5fd6e6" opacity="0.11">∇·E = ρ/ε₀</text>
    <text x="334" y="693" font-size="56" fill="#5fd6e6" opacity="0.10">∫ₐᵇ f(x)dx</text>
    <text x="631" y="693" font-size="56" fill="#5fd6e6" opacity="0.09">Δx Δp ≥ ℏ/2</text>
    <text x="953" y="693" font-size="44" fill="#5fd6e6" opacity="0.12">ds² = dx² + dy²</text>
    <text x="69" y="783" font-size="62" fill="#5fd6e6" opacity="0.09">Δ = b² − 4ac</text>
    <text x="455" y="783" font-size="50" fill="#5fd6e6" opacity="0.08">g = 9.81 m/s²</text>
    <text x="789" y="783" font-size="50" fill="#5fd6e6" opacity="0.07">∇·B = 0</text>
    <text x="985" y="783" font-size="40" fill="#5fd6e6" opacity="0.06">KE = ½mv²</text>
    <text x="104" y="867" font-size="40" fill="#5fd6e6" opacity="0.06">π = 4 Σ (−1)ⁿ/(2n+1)</text>
    <text x="500" y="867" font-size="40" fill="#5fd6e6" opacity="0.09">ζ(s) = Σ 1/nˢ</text>
    <text x="767" y="867" font-size="56" fill="#5fd6e6" opacity="0.09">R = ρL/A</text>
    <text x="1012" y="867" font-size="56" fill="#5fd6e6" opacity="0.12">∇×E = −∂B/∂t</text>
    <text x="100" y="950" font-size="50" fill="#5fd6e6" opacity="0.10">det(A − λI) = 0</text>
    <text x="480" y="950" font-size="44" fill="#5fd6e6" opacity="0.11">(a+b)ⁿ = Σ C(n,k) aⁿ⁻ᵏbᵏ</text>
    <text x="996" y="950" font-size="40" fill="#5fd6e6" opacity="0.12">E = mc²</text>
    <text x="99" y="1034" font-size="62" fill="#5fd6e6" opacity="0.08">Aᵀ = A⁻¹</text>
    <text x="370" y="1034" font-size="62" fill="#5fd6e6" opacity="0.09">f(x) = Σ aₙxⁿ</text>
    <text x="784" y="1034" font-size="50" fill="#5fd6e6" opacity="0.09">Q = mcΔT</text>
    <text x="88" y="1131" font-size="62" fill="#5fd6e6" opacity="0.08">P(A|B) = P(B|A)P(A)/P(B)</text>
    <text x="815" y="1131" font-size="50" fill="#5fd6e6" opacity="0.12">|z| = √(a²+b²)</text>
    <text x="109" y="1220" font-size="50" fill="#5fd6e6" opacity="0.09">S = k log W</text>
    <text x="397" y="1220" font-size="50" fill="#5fd6e6" opacity="0.13">log(ab) = log a + log b</text>
    <text x="961" y="1220" font-size="50" fill="#5fd6e6" opacity="0.07">∮ E·dl = −dΦ/dt</text>
    <text x="80" y="1301" font-size="56" fill="#5fd6e6" opacity="0.12">a² + b² = c²</text>
    <text x="428" y="1301" font-size="44" fill="#5fd6e6" opacity="0.07">Σ 1/n² = π²/6</text>
    <text x="722" y="1301" font-size="56" fill="#5fd6e6" opacity="0.13">∫∫_D dA</text>
    <text x="941" y="1301" font-size="44" fill="#5fd6e6" opacity="0.06">∫ 1/x dx = ln|x|</text>
    <text x="106" y="1388" font-size="56" fill="#5fd6e6" opacity="0.12">C = 2πr</text>
    <text x="326" y="1388" font-size="62" fill="#5fd6e6" opacity="0.13">F = ma</text>
    <text x="540" y="1388" font-size="44" fill="#5fd6e6" opacity="0.09">∇f = (∂f/∂x, ∂f/∂y)</text>
    <text x="956" y="1388" font-size="56" fill="#5fd6e6" opacity="0.10">A = πr²</text>
    <text x="91" y="1480" font-size="56" fill="#5fd6e6" opacity="0.08">eⁱˣ = cos x + i sin x</text>
    <text x="671" y="1480" font-size="62" fill="#5fd6e6" opacity="0.07">lim (sin x)/x = 1</text>
    <text x="83" y="1573" font-size="56" fill="#5fd6e6" opacity="0.10">PV = nRT</text>
    <text x="328" y="1573" font-size="62" fill="#5fd6e6" opacity="0.07">cosh²x − sinh²x = 1</text>
    <text x="914" y="1573" font-size="40" fill="#5fd6e6" opacity="0.10">∇×B = μ₀J + μ₀ε₀ ∂E/∂t</text>
    <text x="106" y="1659" font-size="44" fill="#5fd6e6" opacity="0.10">tan θ = sin θ/cos θ</text>
    <text x="521" y="1659" font-size="62" fill="#5fd6e6" opacity="0.09">i² = −1</text>
    <text x="764" y="1659" font-size="62" fill="#5fd6e6" opacity="0.12">Fₙ = Fₙ₋₁ + Fₙ₋₂</text>
    <text x="105" y="1746" font-size="44" fill="#5fd6e6" opacity="0.12">∇²φ = 0</text>
    <text x="278" y="1746" font-size="40" fill="#5fd6e6" opacity="0.11">aⁿ + bⁿ = cⁿ</text>
    <text x="527" y="1746" font-size="40" fill="#2fe0f0" opacity="0.58">V = ⁴⁄₃πr³</text>
    <text x="739" y="1746" font-size="44" fill="#5fd6e6" opacity="0.08">σ² = E[(X−μ)²]</text>
    <text x="96" y="1820" font-size="56" fill="#2fe0f0" opacity="0.50">F = G m₁m₂/r²</text>
    <text x="470" y="1820" font-size="62" fill="#2fe0f0" opacity="0.44">φ = (1+√5)/2</text>
    <text x="856" y="1820" font-size="44" fill="#5fd6e6" opacity="0.11">p = mv</text>
    <text x="85" y="1907" font-size="44" fill="#2fe0f0" opacity="0.51">x = (−b ± √(b²−4ac))/2a</text>
    <text x="581" y="1907" font-size="50" fill="#5fd6e6" opacity="0.07">Tr(AB) = Tr(BA)</text>
    <text x="961" y="1907" font-size="56" fill="#5fd6e6" opacity="0.11">∂u/∂t = α ∇²u</text>
    <text x="62" y="1997" font-size="62" fill="#5fd6e6" opacity="0.11">d/dx eˣ = eˣ</text>
    <text x="447" y="1997" font-size="62" fill="#5fd6e6" opacity="0.12">x̄ = Σxᵢ/n</text>
    <text x="776" y="1997" font-size="56" fill="#5fd6e6" opacity="0.07">Γ(n) = (n−1)!</text>
    <text x="1150" y="1997" font-size="40" fill="#5fd6e6" opacity="0.11">⟨ψ|ψ⟩ = 1</text>
    <text x="86" y="2083" font-size="44" fill="#2fe0f0" opacity="0.51">lim (1+1/n)ⁿ = e</text>
    <text x="441" y="2083" font-size="62" fill="#2fe0f0" opacity="0.56">tan θ = sin θ/cos θ</text>
    <text x="71" y="2172" font-size="50" fill="#5fd6e6" opacity="0.08">∇f = (∂f/∂x, ∂f/∂y)</text>
    <text x="543" y="2172" font-size="62" fill="#5fd6e6" opacity="0.10">∇·E = ρ/ε₀</text>
    <text x="872" y="2172" font-size="62" fill="#5fd6e6" opacity="0.09">∫ 1/x dx = ln|x|</text>
    <text x="62" y="2256" font-size="40" fill="#5fd6e6" opacity="0.11">A = πr²</text>
    <text x="219" y="2256" font-size="44" fill="#2fe0f0" opacity="0.51">Δx Δp ≥ ℏ/2</text>
    <text x="472" y="2256" font-size="56" fill="#5fd6e6" opacity="0.10">∇×E = −∂B/∂t</text>
    <text x="821" y="2256" font-size="62" fill="#5fd6e6" opacity="0.10">∫∫_D dA</text>
    <text x="1064" y="2256" font-size="56" fill="#5fd6e6" opacity="0.07">a² + b² = c²</text>
    <text x="66" y="2349" font-size="56" fill="#5fd6e6" opacity="0.09">|z| = √(a²+b²)</text>
    <text x="466" y="2349" font-size="56" fill="#5fd6e6" opacity="0.11">lim (sin x)/x = 1</text>
    <text x="943" y="2349" font-size="50" fill="#5fd6e6" opacity="0.10">V = ⁴⁄₃πr³</text>
    <text x="91" y="2436" font-size="56" fill="#5fd6e6" opacity="0.10">ds² = dx² + dy²</text>
    <text x="516" y="2436" font-size="56" fill="#5fd6e6" opacity="0.11">(a+b)ⁿ = Σ C(n,k) aⁿ⁻ᵏbᵏ</text>
    <text x="103" y="2526" font-size="62" fill="#5fd6e6" opacity="0.10">PV = nRT</text>
    <text x="375" y="2526" font-size="40" fill="#5fd6e6" opacity="0.13">eⁱˣ = cos x + i sin x</text>
    <text x="789" y="2526" font-size="44" fill="#5fd6e6" opacity="0.06">∮ E·dl = −dΦ/dt</text>
    <text x="86" y="2619" font-size="56" fill="#5fd6e6" opacity="0.08">φ = (1+√5)/2</text>
    <text x="434" y="2619" font-size="40" fill="#5fd6e6" opacity="0.11">C = 2πr</text>
    <text x="591" y="2619" font-size="56" fill="#5fd6e6" opacity="0.07">Aᵀ = A⁻¹</text>
    <text x="836" y="2619" font-size="44" fill="#5fd6e6" opacity="0.07">p = mv</text>
    <text x="989" y="2619" font-size="40" fill="#5fd6e6" opacity="0.11">x̄ = Σxᵢ/n</text>
    <text x="96" y="2697" font-size="40" fill="#2fe0f0" opacity="0.60">σ² = E[(X−μ)²]</text>
    <text x="381" y="2697" font-size="50" fill="#5fd6e6" opacity="0.10">F = G m₁m₂/r²</text>
    <text x="715" y="2697" font-size="44" fill="#5fd6e6" opacity="0.08">E = mc²</text>
    <text x="888" y="2697" font-size="44" fill="#5fd6e6" opacity="0.11">F = ma</text>
    <text x="1040" y="2697" font-size="50" fill="#5fd6e6" opacity="0.09">∇·B = 0</text>
    <text x="72" y="2778" font-size="56" fill="#2fe0f0" opacity="0.49">ζ(s) = Σ 1/nˢ</text>
    <text x="446" y="2778" font-size="44" fill="#5fd6e6" opacity="0.07">KE = ½mv²</text>
    <text x="659" y="2778" font-size="44" fill="#2fe0f0" opacity="0.48">∇×B = μ₀J + μ₀ε₀ ∂E/∂t</text>
    <text x="104" y="2868" font-size="62" fill="#5fd6e6" opacity="0.11">log(ab) = log a + log b</text>
    <text x="804" y="2868" font-size="62" fill="#2fe0f0" opacity="0.46">S = k log W</text>
    <text x="81" y="2954" font-size="44" fill="#5fd6e6" opacity="0.07">Δ = b² − 4ac</text>
    <text x="354" y="2954" font-size="50" fill="#5fd6e6" opacity="0.06">aⁿ + bⁿ = cⁿ</text>
    <text x="665" y="2954" font-size="40" fill="#5fd6e6" opacity="0.09">P(A|B) = P(B|A)P(A)/P(B)</text>
  </g>
  <rect x="34" y="34" width="1372" height="3020" rx="44" fill="none"
