<!-- Math Formula Theme - Galaxy S23 Ultra (1440x3088). Edit/recolor via index.html -->
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="3088" viewBox="0 0 1440 3088">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070b16"/><stop offset="55%" stop-color="#04060d"/>
